# MySQL Database (local dev)
spring.datasource.url=jdbc:mysql://localhost:3306/water_refill?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (dev-only signing key — never use in production)
app.jwt.secret=demo-jwt-secret-change-me-in-production-min-32-chars

# CORS
app.frontend-url=http://localhost:5173

# Cookies
app.cookie.secure=false

# Security
app.security.enforce-https=false
app.trust-proxy=false
