# MySQL Database (production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/water_refill?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (must set in production via JWT_SECRET env var)
app.jwt.secret=${JWT_SECRET}

# CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cookies
app.cookie.secure=true

# Security
app.security.enforce-https=true
app.trust-proxy=true
