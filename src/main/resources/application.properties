spring.application.name=water-refill-api-java

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/water_refill?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql=${SQL_BIND_LOG_LEVEL:TRACE}

# JWT
app.jwt.secret=${JWT_SECRET:demo-jwt-secret-change-me-in-production-min-32-chars}
app.jwt.access-expiration-ms=900000
app.jwt.remember-expiration-ms=2592000000
app.jwt.issuer=water-refill
app.jwt.audience=water-refill-api

# Seeding
app.seed.mode=${SEED_MODE:full}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:password}

# CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cookies
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.samesite=Lax
app.cookie.refresh-samesite=Strict

# Security
app.security.bcrypt-strength=12
app.security.enforce-https=${ENFORCE_HTTPS:false}
app.trust-proxy=${TRUST_PROXY:false}

# Rate limiting
app.security.rate-limit.login.max=10
app.security.rate-limit.login.window-ms=60000
app.security.rate-limit.refresh.max=20
app.security.rate-limit.refresh.window-ms=60000

# Refresh tokens
app.refresh.session-expiration-ms=86400000
app.refresh.fingerprint-max-mismatches=5
app.refresh.fingerprint-window-ms=600000
app.jwt-purge-cron=0 0 3 * * ?

# Caffeine cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# File Upload
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
