spring.application.name=water-refill-api-java
spring.profiles.default=dev

# Server
server.port=8080

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.access-expiration-ms=900000
app.jwt.remember-expiration-ms=604800000
app.jwt.issuer=water-refill

# Cookies
app.cookie.samesite=Lax
app.cookie.refresh-samesite=Strict

# Security
app.security.bcrypt-strength=12

# Rate limiting
app.security.rate-limit.login.max=10
app.security.rate-limit.login.window-ms=60000
app.security.rate-limit.refresh.max=20
app.security.rate-limit.refresh.window-ms=60000

# Refresh tokens
app.refresh.session-expiration-ms=86400000
app.refresh.fingerprint-max-mismatches=5
app.refresh.fingerprint-window-ms=600000
app.jwt-purge-cron=0 0 3 * * ?

# Caffeine cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# File Upload
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
