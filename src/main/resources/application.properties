spring.application.name=water-refill-api-java

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/water_refill?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=demo-jwt-secret-change-me-in-production-min-32-chars
app.jwt.access-expiration-ms=900000
app.jwt.remember-expiration-ms=604800000
app.jwt.issuer=water-refill

# CORS
app.frontend-url=http://localhost:5173

# Cookies
app.cookie.secure=false
app.cookie.samesite=Lax
app.cookie.refresh-samesite=Strict

# Security
app.security.bcrypt-strength=12
app.security.enforce-https=false
app.trust-proxy=false

# Rate limiting
app.security.rate-limit.login.max=10
app.security.rate-limit.login.window-ms=60000
app.security.rate-limit.refresh.max=20
app.security.rate-limit.refresh.window-ms=60000

# Refresh tokens
app.refresh.session-expiration-ms=86400000
app.refresh.fingerprint-max-mismatches=5
app.refresh.fingerprint-window-ms=600000
app.jwt-purge-cron=0 0 3 * * ?

# Caffeine cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# File Upload
file.upload-dir=./uploads