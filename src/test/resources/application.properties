spring.application.name=water-refill-api-java

# H2 Database (for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (enabled for testing)
spring.h2.console.enabled=true

# JWT
app.jwt.secret=test-jwt-secret-for-unit-tests-min-32-chars
app.jwt.access-expiration-ms=900000
app.jwt.remember-expiration-ms=604800000
app.jwt.issuer=water-refill

# CORS
app.frontend-url=http://localhost:5173

# Cookies
app.cookie.secure=false
app.cookie.samesite=Lax
app.cookie.refresh-samesite=Strict

# Security
app.security.bcrypt-strength=4
app.security.enforce-https=false
