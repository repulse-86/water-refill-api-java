spring.application.name=water-refill-api-java

# H2 Database (for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (enabled for testing)
spring.h2.console.enabled=true

# JWT
app.jwt.secret=test-jwt-secret-for-unit-tests-min-32-chars
app.jwt.access-expiration-ms=900000
app.jwt.remember-expiration-ms=604800000
app.jwt.issuer=water-refill

# CORS
app.frontend-url=http://localhost:5173

# Cookies
app.cookie.secure=false
app.cookie.samesite=Lax
app.cookie.refresh-samesite=Strict

# Security
app.security.bcrypt-strength=4
app.security.enforce-https=false
app.trust-proxy=false

# Rate limiting (high limits for tests to avoid cross-test throttling)
app.security.rate-limit.login.max=100000
app.security.rate-limit.login.window-ms=60000
app.security.rate-limit.refresh.max=100000
app.security.rate-limit.refresh.window-ms=60000

# Refresh tokens
app.refresh.session-expiration-ms=86400000
app.refresh.fingerprint-max-mismatches=5
app.refresh.fingerprint-window-ms=600000
app.jwt-purge-cron=0 0 3 * * ?

# Disable caching in tests to avoid stale data between test methods
spring.cache.type=none
